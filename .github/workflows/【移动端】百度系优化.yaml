name: 【移动端】百度系优化

on:
  push:
    branches: ["master"]
    paths:
      - "scripts-vite/【移动端】百度系优化/**"
      - ".github/workflows/【移动端】百度系优化.yaml"
      - "!scripts-vite/【移动端】百度系优化/README.md"
      - "!scripts-vite/【移动端】百度系优化/dist/*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: set git
        run: |
          git config --global core.symlinks false

      - name: 校验
        uses: actions/checkout@v4

      - uses: volta-cli/action@v4

      - name: 设置Node和pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 构建
        run: |
          cd ./scripts-vite/【移动端】百度系优化
          echo "当前目录："$(pwd)
          pnpm install
          pnpm run build

      - name: 上传附件
        uses: actions/upload-artifact@main
        with:
          name: 【移动端】百度系优化
          path: ./scripts-vite/【移动端】百度系优化/dist

      - name: 下载附件
        uses: actions/download-artifact@main
        with:
          name: 【移动端】百度系优化
